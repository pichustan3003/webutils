<!DOCTYPE html>

<head>
    <title>Home</title>
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet">
</head>

<body>
    <div id="navbar"></div>
    <main>
        <h1 id="mainTitle">CLOCK</h1>
        <h1 class="lateFade" id="clock"></h1>
        <h2 class="lateFade" id="day"></h2>
    </main>
</body>

<script src="../JS/autoHead.js"></script>
<script>
    const munth = {
        0:"January",
        1:"February",
        2:"March",
        3:"April",
        4:"May",
        5:"June",
        6:"July",
        7:"August",
        8:"September",
        9:"October",
        10:"November",
        11:"December"
    }

    const day = {
        0:"Sunday",
        1:"Monday",
        2:"Tuesday",
        3:"Wednesday",
        4:"Thursday",
        5:"Friday",
        6:"Saturday"
    }

    const numSuf = {
        "1":"st",
        "2":"nd",
        "3":"rd",
    }

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function timeOut() {
        while (true) {
            timeNow = new Date()
            let suffix = (numSuf[String(timeNow.getDate()).substr(String(timeNow.getDate()).length - 1)] !== undefined) ? numSuf[String(timeNow.getDate()).substr(String(timeNow.getDate()).length - 1)] : "th"
            document.getElementById("clock").textContent = `${String(timeNow.getHours()).padStart(2,0)}:${String(timeNow.getMinutes()).padStart(2,0)}:${String(timeNow.getSeconds()).padStart(2,0)}`
            document.getElementById("day").textContent = `${day[timeNow.getDay()]} The ${timeNow.getDate()}${suffix} OF ${munth[timeNow.getMonth()]} ${timeNow.getFullYear()}`
            await wait(1)
        }
    }
    timeOut()
</script>
