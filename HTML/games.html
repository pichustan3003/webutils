<!DOCTYPE html>

<head>
    <title>Home</title>
    <link rel="stylesheet" href="../CSS/global.css">
    <link rel="stylesheet" href="../CSS/simple.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unica+One&display=swap" rel="stylesheet">
</head>

<body>
    <div id="navbar"></div>
    <main>
        <h1 id="mainTitle">Games</h1>
        <h3 class="lateFade" id="fun">I love fun!</h3>
        <table class="lateFade" id="mainTable">
        </table>
    </main>
</body>

<script src="../JS/autoHead.js"></script>

<script>
    async function loadTabularData() {
        const resp = await fetch("../DATA/gameTable.json")
        return await resp.json()
    }
    async function writeTable(){
        console.log("Running")
        const data = await loadTabularData()
        let out = "<tr>"
        data.forEach((element, index) => {
            out += `<td class="linkCube"><a href="${element.path}">`
            out += `<h3 class="utilTitle">${element.name}</h3><p class="utilDesc">${element.description}</p><img class="utilImg" src="../MEDIA/${element.image}">`
            out += "</a></td>"
            if ((index + 1 ) % 4 == 0) {out += "</tr><tr>"}
        });
        out += "</tr>"
        document.getElementById("mainTable").innerHTML = out
    }
    writeTable()
</script>
