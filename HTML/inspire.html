<body>
    <div id="navbar"></div>
    <main>
        <h1 id="mainTitle">Inspirational Quotes</h1>
        <h1 class="lateFade" id="inspired"></h1>
        <h2 class="lateFade unselectable" id="babyOneMoreTime" onmousedown="writeFunQuote()">Hit me again!</h2>
        <h2 class="unselectable" id="feelIt" onmousedown="fuckingIdiot()">Hit me againI</h2>
    </main>
</body>

<script src="../JS/autoHead.js"></script>

<script>
    function writeFunQuote(fudge = 0){
        
        const butt = document.getElementById("inspired")
        const indx = (fudge === 0) ? Math.floor(Math.random() * data.length) : fudge
        butt.innerHTML = data[indx];
        console.log(indx)
        if (indx == 20){
            document.getElementById("feelIt").style.display = "inline";
        } 
        else {
            document.getElementById("feelIt").style.display = "none";
        }
    }

    async function getData() {
        data = await (await fetch("../DATA/quotes.json")).json()
        writeFunQuote();
    }

    function goodLad(){
        document.getElementsByTagName("body")[0].style.backgroundColor = "black";
        document.getElementById("inspired").innerHTML = "Good Lad";
        document.getElementById("babyOneMoreTime").innerHTML = "Hit me again!";
        document.getElementById("babyOneMoreTime").style.backgroundColor = "";
        document.getElementById("babyOneMoreTime").setAttribute("onmousedown", "writeFunQuote()");
    }

    function fuckingIdiot(){
        document.getElementsByTagName("body")[0].style.backgroundColor = "red";
        document.getElementById("inspired").innerHTML = "FOOL Now Poop";
        document.getElementById("babyOneMoreTime").innerHTML = "Poop";
        document.getElementById("babyOneMoreTime").style.backgroundColor = "brown";
        document.getElementById("babyOneMoreTime").setAttribute("onmousedown", "goodLad()");
        document.getElementById("feelIt").style.display = "none";
    }
    let data;
    getData()
</script>
